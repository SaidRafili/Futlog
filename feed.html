<link rel="stylesheet" href="style.css">

<body>

<header class="topbar">
  <a class="logo" href="index.html">Futlooooooooooog</a>
  <form class="search" role="search" id="searchForm" action="search.html" method="get">
    <input type="search" id="q" name="q" placeholder="Search teams, competitions, seasons" aria-label="Search matches">
    <button type="submit" aria-label="Search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  </form>
  <nav class="nav"><a href="index.html#matches">Matches</a><a href="feed.html">Feed</a></nav>
  <button class="avatar-btn" aria-label="Account"><svg width="14" height="14" viewBox="0 0 24 24" fill="#1b1a3d"><circle cx="12" cy="8" r="4.5"/><path d="M3 21c0-5 4-7 9-7s9 2 9 7z"/></svg></button>
</header>

<!-- FEED PAGE -->
<main id="feedPage">
  <div class="fd-wrap">
    <section>
      <div class="fd-head"><h1>Feed</h1>
        <div class="fd-tabs" id="fdTabs" role="tablist"><button role="tab" data-fa="tab" data-v="latest">Latest</button><button role="tab" data-fa="tab" data-v="top">Top</button><button role="tab" data-fa="tab" data-v="following">Following</button></div></div>
      <form class="fd-comp" id="fdForm">
        <input type="text" id="fdInput" placeholder="Share a thought on the game…" maxlength="280" aria-label="Write a post">
        <div class="fd-row"><select id="fdMatch" aria-label="Tag a match"></select><button type="submit">Post</button></div>
      </form>
      <div class="fd-filter" id="fdFilter" hidden></div>
      <div id="fdList"></div>
    </section>
    <aside class="fd-side" id="fdSide"></aside>
  </div>
</main>

<footer class="site-footer">
  <div class="ft-in">
    <div class="ft-brand">
      <a class="logo" href="index.html">Futlog</a>
      <p>Log, rate and talk about the football matches you watch.</p>
    </div>
    <nav class="ft-col" aria-label="Footer navigation">

      <a href="index.html#matches">Matches</a><a href="feed.html">Feed</a><a href="article.html?id=1">Articles</a><a href="profile.html?u=saidrafili">Profile</a>

      <a href="https://instagram.com/futlog" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
      <a href="https://youtube.com/@futlog" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
      <a href="https://discord.gg/futlog" target="_blank" rel="noopener noreferrer">Discord ↗</a>
